<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intercom · Claude 会话对讲台</title>
<style>
  :root {
    --bg: #f6f4ef; --ink: #1c1a17; --muted: #7a746a; --card: #fffdf8;
    --line: #e5dfd3; --accent: #b4552d; --accent-soft: #f3e0d5; --ok: #2e7d4f; --off: #a39c8f;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
  header { padding: 18px 28px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 12px; }
  header h1 { font-size: 20px; letter-spacing: 1px; }
  header .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--off); display: inline-block; }
  header .dot.live { background: var(--ok); }
  header span.sub { color: var(--muted); font-size: 13px; }
  main { display: grid; grid-template-columns: 340px 1fr; gap: 20px; padding: 20px 28px; max-width: 1200px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .card h2 { font-size: 14px; color: var(--muted); margin-bottom: 12px; font-weight: 600; letter-spacing: .5px; }
  .sess { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; cursor: pointer; }
  .sess.sel { border-color: var(--accent); background: var(--accent-soft); }
  .sess .name { font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .sess .meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .pill { font-size: 11px; padding: 1px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
  .pill.on { background: #dcecdf; color: var(--ok); }
  input, select, textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px;
    font-size: 13px; background: #fff; margin-bottom: 8px; font-family: inherit; }
  label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 3px; }
  button { padding: 8px 14px; border: none; border-radius: 7px; background: var(--accent); color: #fff;
    font-size: 13px; cursor: pointer; }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  .row { display: flex; gap: 8px; }
  #chat { height: 52vh; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 4px; }
  .msg { max-width: 78%; padding: 9px 13px; border-radius: 10px; font-size: 13.5px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  .msg.in { background: #fff; border: 1px solid var(--line); align-self: flex-start; }
  .msg.out { background: var(--accent-soft); align-self: flex-end; }
  .msg .who { font-size: 11px; color: var(--muted); margin-bottom: 3px; }
  #events { height: 150px; overflow-y: auto; font-family: Consolas, monospace; font-size: 11.5px; color: var(--muted); }
  .linkline { font-size: 13px; padding: 6px 0; border-bottom: 1px dashed var(--line); display: flex; justify-content: space-between; align-items: center; }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 30px 0; }
</style>
</head>
<body>
<header>
  <h1>🦦 Intercom</h1>
  <span class="dot" id="livedot"></span>
  <span class="sub" id="livehint">连接中…</span>
</header>
<main>
  <div>
    <div class="card">
      <h2>会话（点选后在右侧聊天）</h2>
      <div id="sesslist"><div class="empty">还没有会话，先在下方创建 ↓</div></div>
    </div>
    <div class="card">
      <h2>新建会话预设</h2>
      <label>名称（英文/数字）</label><input id="p_name" placeholder="例如 alice">
      <label>API 地址（留空用官方默认）</label><input id="p_base" placeholder="https://api.anthropic.com">
      <label>API 密钥（只保存在本机）</label><input id="p_token" type="password" placeholder="sk-...">
      <div class="row">
        <div style="flex:1"><label>模型</label><input id="p_model" placeholder="claude-opus-5"></div>
        <div style="flex:1"><label>努力强度</label>
          <select id="p_effort"><option value="">默认</option><option>low</option><option>medium</option>
            <option>high</option><option>xhigh</option><option>max</option></select></div>
      </div>
      <label>工作目录（可选）</label><input id="p_cwd" placeholder="C:/work/proj">
      <label>人设提示（可选）</label><textarea id="p_preamble" rows="2" placeholder="你是后端负责人…"></textarea>
      <button onclick="saveProfile()">保存预设</button>
    </div>
    <div class="card">
      <h2>桥接（两个会话自动互相对话）</h2>
      <div class="row">
        <select id="link_a"></select><select id="link_b"></select>
      </div>
      <div class="row">
        <button onclick="doLink(true)">建立桥接</button>
        <button class="ghost" onclick="doLink(false)">解除</button>
      </div>
      <div id="links" style="margin-top:10px"></div>
    </div>
  </div>
  <div>
    <div class="card">
      <h2 id="chat_title">对话</h2>
      <div id="chat"><div class="empty">选择一个会话开始</div></div>
      <div class="row" style="margin-top:10px">
        <input id="sendbox" placeholder="给选中的会话发消息…（未启动会自动启动）" onkeydown="if(event.key==='Enter')sendMsg()">
        <button onclick="sendMsg()">发送</button>
      </div>
      <div class="row" style="margin-top:8px">
        <button class="ghost" id="btn_toggle" onclick="toggleSess()">启动 / 停止</button>
        <button class="ghost" onclick="loadTranscript()">加载历史</button>
      </div>
    </div>
    <div class="card">
      <h2>实时事件</h2>
      <div id="events"></div>
    </div>
  </div>
</main>
<script>
let state = { sessions: [], links: [], profiles: [] };
let selected = null;

async function api(op, body) {
  const r = await fetch("/api/" + op, { method: "POST", body: JSON.stringify(body || {}) });
  return r.json();
}
async function refresh() {
  const r = await fetch("/api/state"); state = await r.json(); render();
}
function profNames() { return state.profiles.map(p => p.name); }
function sessOf(n) { return state.sessions.find(s => s.name === n); }

function render() {
  const list = document.getElementById("sesslist");
  const names = [...new Set([...profNames(), ...state.sessions.map(s => s.name)])];
  list.innerHTML = names.length ? "" : '<div class="empty">还没有会话，先在下方创建 ↓</div>';
  for (const n of names) {
    const s = sessOf(n), p = state.profiles.find(x => x.name === n) || {};
    const div = document.createElement("div");
    div.className = "sess" + (n === selected ? " sel" : "");
    div.onclick = () => { selected = n; render(); };
    div.innerHTML = `<div class="name">${n}
        <span class="pill ${s && s.alive ? "on" : ""}">${s && s.alive ? "运行中" : "未启动"}</span></div>
      <div class="meta">${p.model || "默认模型"} · ${p.effort || "默认强度"}${p.base_url ? " · " + p.base_url : ""}
        ${s && s.turns ? " · " + s.turns + " 轮" : ""}</div>`;
    list.appendChild(div);
  }
  for (const id of ["link_a", "link_b"]) {
    const sel = document.getElementById(id);
    const cur = sel.value;
    sel.innerHTML = names.map(n => `<option>${n}</option>`).join("");
    sel.value = cur;
  }
  document.getElementById("links").innerHTML = state.links.map(l =>
    `<div class="linkline"><span>🔗 ${l.a} ⇄ ${l.b}${l.paused ? "（已暂停）" : ""} · ${l.hops} 跳</span>
     <button class="ghost" onclick="api('unlink',{a:'${l.a}',b:'${l.b}'}).then(refresh)">解除</button></div>`).join("")
    || '<div class="empty">暂无桥接</div>';
  document.getElementById("chat_title").textContent = selected ? `对话 · ${selected}` : "对话";
  document.getElementById("btn_toggle").textContent =
    selected && sessOf(selected) && sessOf(selected).alive ? "停止" : "启动";
}

function addMsg(who, text, out) {
  const chat = document.getElementById("chat");
  if (chat.querySelector(".empty")) chat.innerHTML = "";
  const div = document.createElement("div");
  div.className = "msg " + (out ? "out" : "in");
  div.innerHTML = `<div class="who">${who}</div>`;
  div.appendChild(document.createTextNode(text));
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function sendMsg() {
  const box = document.getElementById("sendbox");
  const text = box.value.trim();
  if (!selected || !text) return;
  box.value = "";
  addMsg("我 → " + selected, text, true);
  const r = await api("send", { name: selected, text });
  if (!r.ok) addMsg("系统", "发送失败：" + (r.error || ""), false);
  refresh();
}
async function toggleSess() {
  if (!selected) return;
  const alive = sessOf(selected) && sessOf(selected).alive;
  const r = await api(alive ? "stop" : "spawn", { name: selected });
  if (!r.ok) addMsg("系统", "操作失败：" + (r.error || ""), false);
  refresh();
}
async function saveProfile() {
  const r = await api("profile_set", {
    name: p_name.value.trim(), base_url: p_base.value.trim(), auth_token: p_token.value.trim(),
    model: p_model.value.trim(), effort: p_effort.value, cwd: p_cwd.value.trim(),
    preamble: p_preamble.value.trim(),
  });
  if (!r.ok) return alert(r.error);
  p_name.value = p_token.value = "";
  refresh();
}
async function doLink(yes) {
  const a = link_a.value, b = link_b.value;
  if (!a || !b) return;
  const r = await api(yes ? "link" : "unlink", { a, b });
  if (!r.ok) alert(r.error || "失败");
  refresh();
}
async function loadTranscript() {
  if (!selected) return;
  const r = await (await fetch("/api/transcript?name=" + selected + "&limit=50")).json();
  const chat = document.getElementById("chat");
  chat.innerHTML = "";
  if (!r.texts.length) chat.innerHTML = '<div class="empty">没有历史记录</div>';
  for (const t of r.texts) addMsg(selected, t, false);
}

const es = new EventSource("/api/events");
es.onopen = () => { livedot.className = "dot live"; livehint.textContent = "已连接 broker"; };
es.onerror = () => { livedot.className = "dot"; livehint.textContent = "连接断开，重试中…"; };
es.onmessage = (m) => {
  const ev = JSON.parse(m.data);
  const feed = document.getElementById("events");
  const label = { text: "💬", sent: "📤", spawned: "🟢", stopped: "⚫", init: "🔑",
                  turn_end: "✅", link_paused: "⏸️" }[ev.type] || "·";
  feed.innerHTML += `<div>${label} [${ev.name || "-"}] ${ev.type} ${(ev.text || ev.reason || "").slice(0, 120)}</div>`;
  feed.scrollTop = feed.scrollHeight;
  if (ev.type === "text" && ev.name === selected) addMsg(selected, ev.text, false);
  if (["spawned", "stopped", "init", "turn_end", "link_paused"].includes(ev.type)) refresh();
};

refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
